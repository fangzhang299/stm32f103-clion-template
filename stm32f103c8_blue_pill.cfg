# STM32F103C8 "Blue Pill" + ST-Link over SWD
# Self-contained config for CLion / OpenOCD:
#   interface + transport + target in one file.
#
# CLion only loads a single .cfg, so this file must be complete.

# --- Interface: ST-Link (SWD) -----------------------------------------------
source [find interface/stlink.cfg]
transport select swd

# --- Target: STM32F103C8 (Medium Density) -----------------------------------
source [find target/stm32f1x.cfg]

# Clone ST-Link + Dupont wires are flaky at the 1 MHz default; slow down SWD.
adapter speed 500

# NOTE:
# There is a fair bit of confusion about whether the "Blue Pill" has 128kB or 64kB flash size.
# The most likely cause is that there exist a -C8 and a -CB variant of the STM32F103, where
# the C8 has 64kB, the CB has 128kB as per specification. "Blue Pill" boards are manufactured
# by a lot of different vendors, some may actually use the CB variant. This board file
# overrides the internal size detection to 128kB. Comment the line below for a genuine
# 64kB C8 if you want strict 64kB (not required for small programs).
set FLASH_SIZE 0x20000
